name: Daily data update

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 19:00 UTC = 한국 시간 04:00
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Collect new data
        id: collect
        continue-on-error: true   # 실패해도 기존 CSV는 그대로 두고, 실패 기록만 커밋한다
        run: python collect.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "data: daily update $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          fi
